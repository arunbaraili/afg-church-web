<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policy | AFG Church</title>
    <link rel="stylesheet" href="privacy.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

    <nav class="legal-nav">
        <div class="nav-container">
            <a href="index.html" class="back-home-btn">
                <i class="fa-solid fa-arrow-left-long"></i> Back to Home
            </a>
            <span class="brand-name">AFG Church</span>
        </div>
    </nav>

    <main class="privacy-container">
        <article class="privacy-card">
            <h1 id="policy-title">Privacy Policy</h1>
            <p class="last-updated">Last Updated: <span id="policy-date">-</span></p>
            <hr class="divider">

            <p id="policy-intro" class="lead-text"></p>

            <div id="markdown-content" class="legal-markdown"></div>
        </article>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
        
            fetch("content/privacy.md")
                .then(res => {
                    if (!res.ok) throw new Error("Markdown file not found.");
                    return res.text();
                })
                .then(markdownData => {
                    const parts = markdownData.split('---');
                    
                    if (parts.length > 2) {
                        const frontMatter = parts[1];
                        const standardMarkdown = parts.slice(2).join('---');

                        const titleMatch = frontMatter.match(/title:\s*(.*)/);
                        const dateMatch = frontMatter.match(/lastUpdated:\s*(.*)/);

                        if (titleMatch) document.getElementById("policy-title").textContent = titleMatch[1].replace(/['"]/g, '');
                        if (dateMatch) document.getElementById("policy-date").textContent = dateMatch[1].replace(/['"]/g, '');

                        document.getElementById("markdown-content").innerHTML = marked.parse(standardMarkdown);
                    } else {
                        document.getElementById("markdown-content").innerHTML = marked.parse(markdownData);
                    }
                })
                .catch(err => {
                    console.error("Error updating legal template data:", err);
                    document.getElementById("markdown-content").innerHTML = "<p>Policy elements are temporarily unavailable.</p>";
                });
        });
    </script>
</body>

</html>
